version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       retail_saas
      POSTGRES_USER:     retail_app
      POSTGRES_PASSWORD: change_me_in_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_app -d retail_saas"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nerva-network

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nerva-network

  auth-tenant:
    build:
      context: .
      dockerfile: services/auth-tenant/Dockerfile
    env_file: .env
    environment:
      PORT: 3001
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks:
      - nerva-network
    restart: unless-stopped

  inventory:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    env_file: .env
    environment:
      PORT: 3002
      NODE_ENV: development
    ports:
      - "3002:3002"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks:
      - nerva-network
    restart: unless-stopped

  sales-sync:
    build:
      context: .
      dockerfile: services/sales-sync/Dockerfile
    env_file: .env
    environment:
      PORT: 3003
      NODE_ENV: development
      # Queue name for BullMQ - must not contain colons
      SYNC_QUEUE_NAME: sales-sync-batch
    ports:
      - "3003:3003"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks:
      - nerva-network
    restart: unless-stopped

  ledger-payments:
    build:
      context: .
      dockerfile: services/ledger-payments/Dockerfile
    env_file: .env
    environment:
      PORT: 3004
      NODE_ENV: development
    ports:
      - "3004:3004"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks:
      - nerva-network
    restart: unless-stopped

  whatsapp-engine:
    build:
      context: .
      dockerfile: services/whatsapp-engine/Dockerfile
    env_file: .env
    environment:
      PORT: 3005
      NODE_ENV: development
    ports:
      - "3005:3005"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks:
      - nerva-network
    restart: unless-stopped

  shifts:
    build:
      context: .
      dockerfile: services/shifts/Dockerfile
    env_file: .env
    environment:
      PORT: 3006
      NODE_ENV: development
    ports:
      - "3006:3006"
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - nerva-network
    restart: unless-stopped

  # ── API Gateway (nginx) — single entry point for all backend services ────────
  gateway:
    image: nginx:1.25-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - auth-tenant
      - inventory
      - sales-sync
      - ledger-payments
      - whatsapp-engine
      - shifts
    networks:
      - nerva-network
    restart: unless-stopped

  # ── Frontend (Next.js) ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ../Nerva-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - gateway
    networks:
      - nerva-network
    restart: unless-stopped

networks:
  nerva-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local