worker_processes auto;

events { worker_connections 1024; }

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ─── Docker Container Upstreams ──────────────────────────────────────────────
  # These are the container names from docker-compose.yml
  upstream auth_service {
    server auth-tenant:3001;
  }

  upstream inventory_service {
    server inventory:3002;
  }

  upstream sales_service {
    server sales-sync:3003;
  }

  upstream analytics_service {
    server ledger-payments:3004;
  }

  upstream whatsapp_service {
    server whatsapp-engine:3005;
  }

  upstream shifts_service {
    server shifts:3006;
  }

  upstream superadmin_service {
    server superadmin:3007;
  }

  upstream realtime_service {
    server realtime:3008;
  }

  server {
    listen 8080;
    server_name _;

    # proxy settings common to all locations
    proxy_http_version 1.1;
    proxy_cache_bypass $http_upgrade;

    # ─── Auth Service ────────────────────────────────────────────────────────────
    location /api/v1/auth/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://auth_service$request_uri;
      
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # ─── Inventory Service ───────────────────────────────────────────────────────
    location /api/v1/inventory/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://inventory_service$request_uri;
      
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # ─── Sales/Sync Service ──────────────────────────────────────────────────────
    # NOTE: sales-sync only ever mounts routes under /api/v1/sync (plus
    # /api/v1/sync/analytics — see analytics-router.ts — and
    # /api/v1/sync/sales/:saleId/refunds — see sales-router.ts) — there is no
    # /api/v1/sales/* handler in that service and the frontend never calls it,
    # so the old /api/v1/sales/ location block here (which always 404'd) has
    # been removed rather than kept as dead routing.
    location /api/v1/sync/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://sales_service$request_uri;
      
      # Longer timeout for sync operations
      proxy_connect_timeout 120s;
      proxy_send_timeout 120s;
      proxy_read_timeout 120s;
    }

    # ─── Ledger Service ──────────────────────────────────────────────────────────
    location /api/v1/ledger/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://analytics_service$request_uri;
      
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # ─── WhatsApp Service ────────────────────────────────────────────────────────
    location /api/v1/whatsapp/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://whatsapp_service$request_uri;
      
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # ─── Shifts Service ──────────────────────────────────────────────────────────
    location /api/v1/shifts/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://shifts_service$request_uri;

      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # ─── Superadmin Service ──────────────────────────────────────────────────────
    # Platform-level tenant lifecycle (suspend/unblock/delete/purge) — every
    # route behind requireSuperadmin() (see services/superadmin). Not part of
    # any tenant's normal traffic; consider restricting this location to an
    # internal network / VPN in production on top of the app-level check.
    location /api/v1/superadmin/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://superadmin_service$request_uri;

      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # ─── Realtime Service (WebSocket push + daily expiration cron) ──────────────
    # No REST API of its own — Socket.IO's client speaks this path for both
    # its long-poll fallback and the ws:// upgrade, so both need to land here.
    # $connection_upgrade/Upgrade header forwarding is already set up above for
    # every location; the read/send timeouts are widened because a live
    # WebSocket is long-lived by design, not a fixed-length request/response.
    location /socket.io/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://realtime_service$request_uri;

      proxy_connect_timeout 60s;
      proxy_send_timeout 1d;
      proxy_read_timeout 1d;
    }

    # ─── Health Check ────────────────────────────────────────────────────────────
    location /health {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://analytics_service/health;
      
      proxy_connect_timeout 5s;
      proxy_send_timeout 5s;
      proxy_read_timeout 5s;
    }

    # ─── Debug Routes (Development Only) ────────────────────────────────────────
    location /debug/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://analytics_service/debug/;
    }

    # ─── Catch-all ──────────────────────────────────────────────────────────────
    location / {
      return 404;
    }
  }
}